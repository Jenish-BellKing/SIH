version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ibvap-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DATABASE_URL=sqlite:///./ibvap.db
    volumes:
      - ./backend:/app/backend
      - ./ai:/app/ai
      - ./models:/app/models
      - ./test-videos:/app/test-videos
      - ./snapshots:/app/snapshots
      - ./scripts:/app/scripts
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  # Optional Frontend container once frontend build is initialized
